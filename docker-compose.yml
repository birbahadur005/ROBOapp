version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ravan_receptionist_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://ravan_admin:ravan_secure_pass_2026@postgres:5432/ravan_reception?schema=public
      - JWT_SECRET=production-secret-jwt-key-ravan-2026-min-32-chars
      - SESSION_SECRET=production-session-key-ravan-reception-2026
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - STORAGE_DRIVER=local
      - STORAGE_UPLOAD_DIR=/app/uploads/visitor-photos
      - APP_URL=http://localhost:5000
      - CORS_ORIGIN=http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - visitor_uploads:/app/uploads/visitor-photos
      - logo_uploads:/app/uploads/logos

  postgres:
    image: postgres:16-alpine
    container_name: ravan_receptionist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ravan_admin
      POSTGRES_PASSWORD: ravan_secure_pass_2026
      POSTGRES_DB: ravan_reception
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ravan_admin -d ravan_reception"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  visitor_uploads:
  logo_uploads:
