<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="robotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#robotGrad)" />
  <!-- Antenna -->
  <line x1="96" y1="36" x2="96" y2="52" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
  <circle cx="96" cy="32" r="7" fill="#38bdf8" />
  <!-- Robot Head -->
  <rect x="44" y="52" width="104" height="88" rx="24" fill="#1e293b" stroke="#3b82f6" stroke-width="4" />
  <!-- Visor Screen -->
  <rect x="58" y="70" width="76" height="34" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
  <rect x="66" y="80" width="60" height="14" rx="7" fill="url(#visorGrad)" />
  <circle cx="78" cy="87" r="3.5" fill="#ffffff" />
  <circle cx="114" cy="87" r="3.5" fill="#ffffff" />
  <!-- Speaker/Mic grille -->
  <line x1="82" y1="120" x2="110" y2="120" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <line x1="86" y1="126" x2="106" y2="126" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <!-- Ears -->
  <rect x="36" y="78" width="8" height="24" rx="4" fill="#3b82f6" />
  <rect x="148" y="78" width="8" height="24" rx="4" fill="#3b82f6" />
</svg>
