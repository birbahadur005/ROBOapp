<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAVAN College Receptionist</title>
    <!-- Single Page Apps for GitHub Pages -->
    <!-- MIT License https://github.com/rafgraph/spa-github-pages -->
    <script type="text/javascript">
      // 1 path segment to keep: for repo path /ROBOapp/
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; text-align: center; padding: 50px; background: #0f172a; color: #94a3b8;">
    <h2>Redirecting to RAVAN College Receptionist...</h2>
    <p>If you are not redirected automatically, <a href="/ROBOapp/" style="color: #38bdf8;">click here to visit the home page</a>.</p>
  </body>
</html>
